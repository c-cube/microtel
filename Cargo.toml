[package]
name = "microtel"
description = "tiny OTLP/HTTP receiver backed by rocksdb"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
include_dir = "0.7"
mimalloc = "0.1.52"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14.6"
rocksdb = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
log = "0.4"

[dev-dependencies]
flate2 = "1.1.11"
serde_json = "1"
libc = "0.2.191"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14.6"
rocksdb = "0.23.0"
tempfile = "3.27.0"
ureq = { version = "2", default-features = false, features = ["json"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
