<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>microtel</title>
    <link rel="stylesheet" href="/vendor/bulma.min.css" />
    <style>
      .chart-tip {
        position: absolute;
        display: none;
        pointer-events: none;
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 0.75rem;
        z-index: 10;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        white-space: pre-line;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 4px;
      }
.wf-row { display: grid; grid-template-columns: minmax(160px, 30%) 1fr 74px; gap: 8px; align-items: center; padding: 2px 4px; border-bottom: 1px solid #f0f0f0; }
    .wf-row:hover { background: #fafafa; }
    .wf-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.85rem; }
    .wf-track { position: relative; height: 14px; background: #f5f5f5; border-radius: 2px; }
    .wf-bar { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; min-width: 2px; }
    .wf-dur { font-size: 0.8rem; color: #666; text-align: right; }
    .wf-attrs { font-size: 0.8rem; padding: 2px 0 6px 8px; color: #444; border-bottom: 1px solid #f0f0f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
